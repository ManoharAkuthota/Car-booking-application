# Render Infrastructure-as-Code Blueprint
# Automatically provisions and connects DrivePulse Backend (Spring Boot) and Frontend (React Vite)

services:
  # 1. Spring Boot 3 Backend Web Service
  - type: web
    name: drivepulse-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    envVars:
      - key: SERVER_PORT
        value: 8080
      - key: DB_URL
        value: jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/car_booking_db?useSSL=true&verifyServerCertificate=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - key: DB_USERNAME
        value: 3HVUhdVZBhSBCPs.root
      - key: DB_PASSWORD
        value: 6BP74bdgTlFpWzrm
      - key: JWT_SECRET
        value: antigravity_mobile_store_super_secret_jwt_key_2026_production_grade_token_signing_secret
      - key: CLOUDINARY_CLOUD_NAME
        value: yx3r97ac
      - key: CLOUDINARY_API_KEY
        value: "665272951174257"
      - key: CLOUDINARY_API_SECRET
        value: WBXFMde0defk0rcafmPXPt2lOd0
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:*,https://*.vercel.app,https://*.onrender.com,https://*.netlify.app"

  # 2. React + Vite Frontend Static Web App
  - type: web
    name: drivepulse-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://drivepulse-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
