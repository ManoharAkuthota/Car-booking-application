    secret: ${JWT_SECRET:antigravity_mobile_store_super_secret_jwt_key_2026_production_grade_token_signing_secret}
    expiration-ms: 86400000 # 24 hours
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:yx3r97ac}
    api-key: ${CLOUDINARY_API_KEY:665272951174257}
    api-secret: ${CLOUDINARY_API_SECRET:WBXFMde0defk0rcafmPXPt2lOd0}
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"
      - "http://localhost:3000"
      - "https://*.onrender.com"
      - "https://*.vercel.app"
